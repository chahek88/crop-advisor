services:
  backend:
    build: .
    working_dir: /app/backend
    command: uvicorn cropadvisor.main:app --host 0.0.0.0 --port 8000
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./models:/app/models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
  frontend:
    build: .
    working_dir: /app/frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      CA_API_URL: http://backend:8000
    env_file: [.env]
    ports: ["8501:8501"]
    depends_on: [backend]
  # Uncomment to run an MQTT broker for your sensors:
  # mqtt:
  #   image: eclipse-mosquitto:2
  #   ports: ["1883:1883"]
